<mat-drawer-container class="example-container" autosize>
  <!-- Основной контент -->
  <mat-drawer-content>
    <div class="content-wrapper">
      <h1 class="classR">Хранилище продуктов</h1>
      <div class="btn">
        <button mat-raised-button (click)="openDialog()">Добавить продукт</button>
        <button mat-raised-button (click)="deleteAllProducts()" class="btnAlldel">Удалить все продукты</button>
        <button mat-fab color="primary" class="basket-toggle" (click)="drawer.toggle()">
          <mat-icon>shopping_cart</mat-icon>
        </button>
      </div>
      <div class="list">
        <ng-container *ngIf="state$ | async as state">
          @if (state.error) {
            <div style="height: 50px; width: 100px">ошибка</div>
          } @else {
            @if (state.isLoading) {
              <div class="bar">
                <mat-progress-bar mode="indeterminate"></mat-progress-bar>
              </div>
            }
            @else {
              <div class="products-grid">
                <ng-container *ngFor="let product of state.products">
                  <app-products-card
                    [product]="product"
                    (productDelete)="deleteProduct($event)"
                    (productEdit)="editProduct($event)"
                    (productAddToBasket)="onAddToBasket($event)">
                  </app-products-card>
                </ng-container>
              </div>
            }
          }
        </ng-container>
      </div>
    </div>
  </mat-drawer-content>

  <!-- Боковая панель корзины -->
  <mat-drawer #drawer mode="side" position="end" class="basket-drawer">
    <app-basket-products></app-basket-products>
  </mat-drawer>
</mat-drawer-container>
